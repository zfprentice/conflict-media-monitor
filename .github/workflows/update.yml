name: Update media data

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (offset from :00 to dodge the GitHub cron rush)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore: ['data/**']  # code changes redeploy the site without refetching

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Ingest GDELT event files and Google News headlines (time-boxed; backlog rolls to the next run)
        if: github.event_name != 'push'
        env:
          BUDGET_MIN: '30'
          NEWS_BUDGET_MIN: '6'      # 30 + 6 + setup stays inside the 50-minute job limit
          PYTHONUNBUFFERED: '1'
        run: python build_data.py

      - name: Rebuild the page from the saved records (code change only, nothing fetched)
        if: github.event_name == 'push'
        env:
          OFFLINE: '1'
        run: python build_data.py

      # Records are committed; page outputs (latest.json, weekly.json, Excel files) are rebuilt
      # every run and deployed without being committed. Runs on other branches are dry runs.
      - name: Commit updated records
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
